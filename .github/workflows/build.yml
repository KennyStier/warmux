name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git autoconf automake \
            sdl2-compat sdl2_image sdl2_mixer sdl2_ttf sdl2_net sdl2_gfx \
            curl libxml2 libpng
      - uses: actions/checkout@v4
      - run: sh .github/ci-build.sh

  ubuntu:
    name: Ubuntu 24.04 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake gettext autopoint pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libsdl2-net-dev libsdl2-gfx-dev libcurl4-openssl-dev libxml2-dev libpng-dev
      - uses: actions/checkout@v4
      - run: sh .github/ci-build.sh

  network-test:
    name: Network game test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake gettext autopoint pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libsdl2-net-dev libsdl2-gfx-dev libcurl4-openssl-dev libxml2-dev libpng-dev
      - uses: actions/checkout@v4
      # A real two-player game over the network, played by the computer
      - run: autoreconf -fi && sh .github/ci-network-test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: network-test-logs-${{ matrix.arch }}
          path: _nettest/run/*.log

  memory-check:
    name: Memory check (sanitizers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake gettext autopoint pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libsdl2-net-dev libsdl2-gfx-dev libcurl4-openssl-dev libxml2-dev libpng-dev
      - uses: actions/checkout@v4
      # The network tests again, built with AddressSanitizer: a use of freed
      # memory fails here even when it wouldn't crash a normal build
      - run: autoreconf -fi && NETTEST_SANITIZE=1 sh .github/ci-network-test.sh
      # Random taps, swipes, touches and keys all through the game
      - run: MONKEY_ROUNDS=6 MONKEY_SECONDS=50 MONKEY_SEED=${{ github.run_number }}00 sh .github/ci-monkey-test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: memory-check-logs
          path: |
            _asantest/run/*.log
            _asantest/monkey/*.log

  fedora:
    name: Fedora
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf -y install git gcc-c++ make autoconf automake gettext-devel \
            pkgconf-pkg-config SDL2-devel SDL2_image-devel SDL2_mixer-devel \
            SDL2_ttf-devel SDL2_net-devel SDL2_gfx-devel \
            libcurl-devel libxml2-devel libpng-devel
      - uses: actions/checkout@v4
      - run: sh .github/ci-build.sh

  windows:
    name: Windows (cross-compiled)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf -y install mingw64-gcc-c++ mingw64-sdl2-compat mingw64-SDL2_image \
            mingw64-SDL2_mixer mingw64-SDL2_ttf mingw64-curl mingw64-libxml2 \
            mingw64-libpng mingw64-gettext mingw64-zlib autoconf automake \
            gettext-devel make git zip curl findutils mingw32-nsis
      - uses: actions/checkout@v4
      - name: Build
        run: |
          git config --global --add safe.directory '*'
          packaging/windows/build-windows.sh "0-$(git rev-parse --short HEAD)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null
      # The same debug key every time, so a new Warmux Preview installs over
      # the last one (Android refuses an update signed with another key)
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Build APK
        env:
          WARMUX_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          packaging/android/prepare.sh
          # Off main and dev (a feature branch, run by hand): "Warmux
          # Preview", to try on a phone next to the other two
          extra=""
          case "$GITHUB_REF_NAME" in main|dev) ;; *) extra=-Pwarmux.preview ;; esac
          cd packaging/android && ./gradlew --no-daemon $extra assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: packaging/android/app/build/outputs/apk/debug/*.apk

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 7.0.0 >/dev/null
          "$HOME/emsdk/emsdk" activate 7.0.0 >/dev/null
      # Emscripten builds its SDL and other ports on first use: keep them
      - uses: actions/cache@v4
        with:
          path: ~/emsdk/upstream/emscripten/cache
          key: emscripten-cache-7.0.0
      - name: Build
        run: |
          . "$HOME/emsdk/emsdk_env.sh"
          packaging/web/prepare.sh
          emcmake cmake -S packaging/web -B packaging/web/build -DCMAKE_BUILD_TYPE=Release -DWARMUX_TESTING=1
          cmake --build packaging/web/build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: packaging/web/build/site/

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # On some GitHub machines, Docker's storage can't move files between
      # the image's layers, and flatpak fails to update the SDK with
      # "Invalid cross-device link". Copy its folder into the container's
      # own layer first.
      - name: Make flatpak's folder writable in place
        run: |
          for d in $(flatpak --installations); do
            du -sh "$d"
            cp -a "$d" "$d.rw" && rm -rf "$d" && mv "$d.rw" "$d"
          done
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: warmux-${{ matrix.arch }}.flatpak
          manifest-path: packaging/flatpak/io.github.KennyStier.Warmux.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
