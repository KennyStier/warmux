plugins {
    id 'com.android.application'
}

// Version from configure.ac, so it never needs updating here
def acVersion = (file('../../../configure.ac').text =~ /AC_INIT\(\s*\[?Warmux\]?\s*,\s*\[?([0-9.]+)/)[0][1]
def parts = acVersion.tokenize('.').collect { it as int } + [0, 0, 0]

android {
    namespace 'io.github.kennystier.warmux'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.kennystier.warmux'
        minSdk 24
        targetSdk 36
        versionName acVersion
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.31.6'
        }
    }

    // Release signing, from the environment (the release workflow sets
    // these from repository secrets). Without them the release APK is
    // unsigned; debug builds always use the local debug key.
    def keystore = System.getenv('WARMUX_KEYSTORE')
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('WARMUX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WARMUX_KEY_ALIAS') ?: 'warmux'
                keyPassword System.getenv('WARMUX_KEY_PASSWORD') ?: System.getenv('WARMUX_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Game data is already compressed (PNG, Ogg); storing it uncompressed
    // makes copying it out of the APK on first start faster
    androidResources {
        noCompress 'png', 'jpg', 'ogg', 'wav'
    }

    lint {
        abortOnError false
    }
}
