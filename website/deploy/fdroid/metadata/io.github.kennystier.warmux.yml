Name: Warmux
Summary: Turn-based artillery battles between free-software mascots
Description: |-
  Teams of free-software mascots (Tux, Gnu, Firefox, Wilber and friends)
  take turns blasting each other across destructible 2D maps with bazookas,
  grenades, baseball bats, ropes and plenty of other questionable equipment.

  Play hot-seat on one device, against the computer, or online in Public
  Battle with players on Android, Windows and Linux.

  This is a maintained fork of Warmux 11.04, ported to SDL2.
