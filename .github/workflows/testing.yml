name: Testing

# Every push to dev publishes "Warmux Testing" as the "testing" pre-release
# (replaced each time). Testing builds are separate apps (they install next
# to Warmux), keep their own settings, and only play on the testing servers.
# See doc/DEVELOPMENT.md.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# A newer push makes an unfinished build pointless
concurrency:
  group: testing
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # e.g. 12.0.3-test42: the coming release, and this build's number
        run: |
          base=$(sed -n 's/^AC_INIT(\[Warmux\], \[\([0-9.]*\)\].*/\1/p' configure.ac)
          echo "version=$base-test${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: packaging/flatpak/make-testing.sh
      # On some GitHub machines, Docker's storage can't move files between
      # the image's layers, and flatpak fails to update the SDK with
      # "Invalid cross-device link". Copy its folder into the container's
      # own layer first.
      - name: Make flatpak's folder writable in place
        run: |
          for d in $(flatpak --installations); do
            du -sh "$d"
            cp -a "$d" "$d.rw" && rm -rf "$d" && mv "$d.rw" "$d"
          done
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: warmux-testing-${{ needs.version.outputs.version }}.flatpak
          manifest-path: packaging/flatpak/io.github.KennyStier.Warmux.Testing.yml
          cache-key: flatpak-testing-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: warmux-testing-*.flatpak

  windows:
    name: Windows
    needs: version
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf -y install mingw64-gcc-c++ mingw64-sdl2-compat mingw64-SDL2_image \
            mingw64-SDL2_mixer mingw64-SDL2_ttf mingw64-curl mingw64-libxml2 \
            mingw64-libpng mingw64-gettext mingw64-zlib autoconf automake \
            gettext-devel make git zip curl findutils mingw32-nsis
      - uses: actions/checkout@v4
      - name: Build
        env:
          WARMUX_TESTING: 1
        run: |
          git config --global --add safe.directory '*'
          packaging/windows/build-windows.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6" >/dev/null
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WARMUX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WARMUX_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          export WARMUX_KEYSTORE="$RUNNER_TEMP/warmux-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$WARMUX_KEYSTORE"
          packaging/android/prepare.sh
          (cd packaging/android && ./gradlew --no-daemon -Pwarmux.testing assembleRelease)
          rm -f "$WARMUX_KEYSTORE"
          mkdir -p dist
          cp packaging/android/app/build/outputs/apk/release/app-release.apk \
            "dist/warmux-testing-${{ needs.version.outputs.version }}-android.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  publish:
    name: Publish testing pre-release
    needs: [version, flatpak, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to list the changes since the last release
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the testing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la dist
          stable=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          {
            echo "**Testing build $VERSION** from the \`dev\` branch ($(git rev-parse --short HEAD))."
            echo
            echo "Not finished: expect bugs. It installs as **Warmux Testing**, next to Warmux,"
            echo "keeps its own settings, and plays only with other testing builds, on the"
            echo "testing servers. Each push to \`dev\` replaces this pre-release."
            echo
            echo "## Downloads"
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`warmux-testing-*-android.apk\` | Android 7.0+: installs next to Warmux |"
            echo "| \`warmux-testing-*-windows-x64-setup.exe\` | Windows 10/11 (64-bit): installer |"
            echo "| \`warmux-testing-*-windows-x64.zip\` | Windows 10/11 (64-bit), portable |"
            echo "| \`warmux-testing-*.flatpak\` | Any Linux: \`flatpak install --user warmux-testing-*.flatpak\` |"
            echo
            if [ -n "$stable" ]; then
              echo "## Changes since $stable"
              echo
              git log --no-merges --format='- %s' "$stable..HEAD"
            fi
          } > notes.md
          gh release delete testing --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create testing dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Warmux Testing $VERSION" \
            --notes-file notes.md
