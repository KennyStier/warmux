Name: Warmux Testing
Summary: 'The next Warmux, early: a build of every change'
Description: |-
  Builds of the version of Warmux being worked on, made every time it
  changes. Expect bugs and the odd crash, and please report them.

  Warmux Testing installs next to Warmux and keeps its own settings and
  teams. It plays online only with other testing builds, in Testing Battle.
